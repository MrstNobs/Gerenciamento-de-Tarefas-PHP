services:
  db:
    image: mariadb:11
    container_name: tarefas-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: Tarefas
      MARIADB_USER: tarefas_user
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - tarefas_data:/var/lib/mysql
      - ./src/config/db.sql:/docker-entrypoint-initdb.d/01-db.sql:ro

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarefas-php
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./:/var/www/html
      - vendor_data:/var/www/html/vendor
    depends_on:
      - db

volumes:
  tarefas_data:
  vendor_data:
    